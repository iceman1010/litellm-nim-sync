name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint-and-test:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
        cache: pip
        cache-dependency-path: requirements-dev.txt

    - name: Install dev dependencies
      run: python3 -m pip install -r requirements-dev.txt

    - name: Syntax check (target interpreter is 3.8+)
      run: python3 -m py_compile sync_nvidia_models.py

    - name: Lint
      run: ruff check .

    - name: Unit tests
      run: pytest -v

    - name: Static safety invariants
      run: |
        # No process spawning, no server config paths, no destructive model endpoints.
        ! grep -nE 'systemctl|subprocess|os\.system|shutil|/etc/|/model/(delete|update|info)' sync_nvidia_models.py
        # The ONLY permitted file write is the self-update replacement: every
        # open( in the script must live inside _self_update().
        ALL=$(grep -cE '\bopen\(' sync_nvidia_models.py || true)
        INSU=$(sed -n '/^def _self_update/,/^def [^_]/p' sync_nvidia_models.py | grep -cE '\bopen\(' || true)
        test "$ALL" = "$INSU"
        # No secrets may live in this repo (only env var *names* are allowed).
        ! grep -rniE 'sk-[a-z0-9_-]{10,}|api[_-]?key\s*=\s*["'"'"'][^o]' \
            sync_nvidia_models.py tests/ docs/ README.md
